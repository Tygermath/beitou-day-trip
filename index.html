<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北投文化綠意一日遊</title>
<style>
:root{
  --primary:#1b4d3e; --primary-light:#2d7a58; --primary-soft:#eaf3ee;
  --accent:#b45309; --accent-soft:#fef3c7;
  --driver:#1e3a8a; --driver-soft:#eff6ff;
  --story:#6d28d9; --story-soft:#f5f3ff; --act:#047857; --act-soft:#ecfdf5;
  --bg:#f6f8f7; --card:#fff; --text:#1e293b; --muted:#64748b; --line:#e2e8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding-bottom:70px}
a{color:inherit}
header{background:linear-gradient(135deg,#133a2e,#1b4d3e 60%,#2d7a58);color:#fff;padding:2.2rem 1rem 2.4rem;text-align:center}
header h1{font-size:1.9rem;letter-spacing:.05em}
header p{opacity:.9;margin:.3rem auto .9rem;max-width:720px}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:.5rem}
.chip{background:rgba(255,255,255,.18);padding:.2rem .8rem;border-radius:999px;font-size:.9rem}
nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:.5rem;padding:.6rem 1rem;overflow-x:auto;justify-content:safe center}
nav a{flex:none;background:#f1f5f9;text-decoration:none;font-weight:600;font-size:.9rem;padding:.45rem .9rem;border-radius:8px;white-space:nowrap}
nav a:hover{background:var(--primary-soft);color:var(--primary)}
nav a.drv{background:var(--driver-soft);color:var(--driver);border:1px solid #bfdbfe}
main{max-width:1000px;margin:1.4rem auto 0;padding:0 16px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.06);padding:1.6rem 1.4rem;margin-bottom:1.8rem;scroll-margin-top:64px}
h2{font-size:1.4rem;color:var(--primary);border-bottom:2px solid var(--line);padding-bottom:.6rem;margin-bottom:.8rem}
.desc{color:var(--muted);font-size:.93rem;margin-bottom:1.1rem}
.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:.8rem 1rem;font-size:.92rem;margin-bottom:1.2rem}
.notice li{margin-left:1.2rem}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:.94rem}
th{background:#f8fafc;text-align:left;padding:.7rem .8rem;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:.65rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.move td{background:#fafbfc;color:var(--muted);font-size:.86rem;padding:.35rem .8rem}
.t{background:var(--accent-soft);color:#92400e;font-weight:700;font-size:.86rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;display:inline-block}
.stay{background:#f1f5f9;color:var(--muted);font-size:.8rem;padding:.12rem .45rem;border-radius:4px;white-space:nowrap}
.place a{font-weight:700;color:var(--primary);text-decoration:none}
.place a:hover{text-decoration:underline}

.spot{border:1px solid var(--line);border-radius:12px;padding:1.2rem;margin-bottom:1.4rem;scroll-margin-top:64px}
.spot-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.4rem;margin-bottom:.3rem}
.spot h3{font-size:1.25rem;color:var(--primary)}
.meta{font-size:.86rem;color:var(--muted)}
.tagline{font-size:.95rem;margin-bottom:.8rem}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin-bottom:1rem}
@media(max-width:560px){.photos{grid-template-columns:1fr}}
figure{position:relative;border-radius:10px;overflow:hidden;background:#e2e8f0;border:1px solid var(--line)}
figure img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
figure .role{position:absolute;top:8px;left:8px;font-size:.78rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;color:#fff;background:#b45309}
figure .role.hl{background:#6d28d9}
figcaption{font-size:.84rem;padding:.45rem .6rem;background:#fff}
figcaption small{display:block;color:var(--muted);font-size:.72rem}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.8rem}
.box{border-radius:8px;padding:.85rem .9rem;border-left:4px solid var(--primary-light);background:#f7fbf9}
.box.story{border-left-color:var(--story);background:var(--story-soft)}
.box.act{border-left-color:var(--act);background:var(--act-soft)}
.box h4{font-size:.95rem;margin-bottom:.35rem;color:var(--primary-light)}
.box.story h4{color:var(--story)} .box.act h4{color:var(--act)}
.box ul{padding-left:1.15rem;font-size:.92rem}
.box li{margin-bottom:.3rem}
.tip{margin-top:.8rem;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:.6rem .9rem;font-size:.9rem}

.tabs{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.tabs button{flex:1 1 200px;padding:.7rem .8rem;border:2px solid var(--primary);background:#fff;color:var(--primary);font:inherit;font-weight:700;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--primary);color:#fff}
.opt{display:none}.opt.on{display:block}
.banner{background:var(--primary-soft);border-radius:10px;padding:1rem;margin-bottom:1rem}
.banner h3{color:var(--primary);font-size:1.15rem}
.banner p{font-size:.9rem;color:#334155}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1rem}
.cat{border:1px solid var(--line);border-radius:10px;padding:1rem}
.cat h4{color:var(--primary);border-bottom:1px dashed var(--line);padding-bottom:.4rem;margin-bottom:.5rem}
.dish{display:flex;justify-content:space-between;gap:.8rem;padding:.4rem 0;border-bottom:1px solid #f1f5f9;font-size:.93rem}
.dish:last-child{border-bottom:none}
.dish small{display:block;color:var(--muted);font-size:.8rem}
.price{font-weight:700;color:var(--accent);white-space:nowrap}
.hot{background:#fee2e2;color:#b91c1c;font-size:.72rem;font-weight:700;padding:.05rem .35rem;border-radius:4px;margin-left:.3rem;white-space:nowrap}
.src{font-size:.82rem;color:var(--muted);margin-top:.8rem}

#driver{border-left:5px solid var(--driver)}
#driver h2{color:var(--driver)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem;margin-bottom:1.1rem}
.stat{background:var(--driver-soft);border:1px solid #dbeafe;border-radius:8px;padding:.8rem}
.stat b{display:block;color:var(--driver);font-size:1.08rem}
.stat span{font-size:.78rem;color:#475569;font-weight:600}
.stat small{color:var(--muted);font-size:.82rem}
.btn{display:inline-block;background:var(--driver);color:#fff;text-decoration:none;padding:.4rem .8rem;border-radius:6px;font-size:.84rem;font-weight:600;margin:.4rem .4rem 0 0;border:none;cursor:pointer;font-family:inherit}
.btn.alt{background:#fff;color:var(--driver);border:1px solid var(--driver)}
h3.sub{color:var(--driver);font-size:1.08rem;margin:1.4rem 0 .6rem}
.leg{border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem;background:#f8fafc;break-inside:avoid}
.leg-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.5rem}
.leg-head b{color:var(--driver)}
.leg-time{background:#dbeafe;color:#1e40af;font-size:.84rem;font-weight:700;padding:.15rem .6rem;border-radius:6px}
.leg ol{padding-left:1.3rem;font-size:.92rem}
.park{background:#fff;border:1px dashed #cbd5e1;border-radius:8px;padding:.6rem .8rem;margin-top:.6rem;font-size:.89rem}
.walk{color:var(--muted);font-size:.9rem;padding:.5rem .9rem;border-left:3px dotted #cbd5e1;margin:0 0 1rem .6rem}
.fab{position:fixed;right:16px;bottom:16px;background:var(--driver);color:#fff;text-decoration:none;font-weight:700;font-size:.9rem;padding:.65rem 1.1rem;border-radius:50px;border:2px solid #fff;box-shadow:0 8px 16px rgba(0,0,0,.2);z-index:30}
footer{text-align:center;color:var(--muted);font-size:.84rem;padding:1.5rem 1rem}
@media(max-width:640px){header h1{font-size:1.5rem}section{padding:1.1rem .9rem}.spot{padding:.9rem}}
.opt-label{display:none}
/* Print / PDF = linear document: nothing hidden behind a tab, every node laid out in reading order. */
@media print{
  @page{size:A4;margin:14mm 12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html{font-size:13px}
  body{background:#fff;padding:0}
  nav,.fab,.tabs,#print-driver{display:none!important}
  main{max-width:none;margin:0;padding:0}
  header{padding:1.4rem 1rem;border-radius:10px;margin-bottom:1rem}
  section{box-shadow:none;border:none;padding:0;margin-bottom:0}
  section+section{break-before:page}
  .opt{display:block!important}
  .opt+.opt{break-before:page}
  .opt-label{display:block;font-weight:700;color:var(--primary);font-size:1.1rem;margin:.2rem 0 .5rem}
  .tw{overflow:visible}
  .spot{break-before:page;border:none;padding:0}
  #spots-body .spot:first-of-type{break-before:auto}
  figure,.box,.cat,.leg,.dish,.tip,.park,.notice,.banner,tr{break-inside:avoid}
  h2,h3,h4{break-after:avoid}
  .photos{grid-template-columns:repeat(3,1fr);gap:.5rem}
  figure img{aspect-ratio:4/3}
  figcaption{font-size:.78rem;padding:.3rem .45rem}
  td{padding:.4rem .6rem} tr.move td{padding:.2rem .6rem}
  .notice{padding:.5rem .8rem;margin-bottom:.7rem}
  .dish{padding:.25rem 0} .cat{padding:.7rem} .menu{gap:.6rem}
  .leg{padding:.7rem;margin-bottom:.6rem} .walk{margin-bottom:.5rem;padding:.25rem .9rem}
  .boxes{gap:.5rem} .box{padding:.6rem .7rem}
  footer{padding:.6rem 0 0}
  body.print-driver header,body.print-driver footer,body.print-driver section:not(#driver){display:none!important}
}
</style>

   "minutes": 50,
   "km": 17,
   "brief": "石牌回板橋（晚間尖峰，約 50 分）",
   "nav_from": "水龜伯古早味 石牌",
   "route": [
    "從石牌路二段依導航往南，接**承德路**或**重慶北路**進市區。",
    "依導航接**環河快速道路**往南，下**華江橋**往板橋方向。",
    "華江橋接板橋文化路一段 → 板橋文化路郵局。"
   ],
   "caution": "路線與時間為估計；石牌到板橋沒有確定的最佳走法，傍晚車多，請以導航即時路況為準，保守抓 50–70 分鐘。",
   "parking": "郵局前路邊下客。"
  }
 ]
}/*__END_TRIP_JSON__*/;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");   // **粗體** only
const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const dur = (a, b) => mins(b) - mins(a);
const q = s => encodeURIComponent(s);
const mapUrl = s => "https://www.google.com/maps/search/?api=1&query=" + q(s.map || s.name);
const navUrl = (o, d, mode) => `https://www.google.com/maps/dir/?api=1&origin=${q(o)}&destination=${q(d)}&travelmode=${mode || "driving"}`;
const list = a => (a || []).map(x => `<li>${rich(x)}</li>`).join("");
const byId = Object.fromEntries(TRIP.stops.map(s => [s.id, s]));
const legNav = l => ({ o: l.nav_from || byId[l.from].map || byId[l.from].name, d: l.nav_to || byId[l.to].map || byId[l.to].name });

function photoHtml(p) {
  const src = p.src || `https://commons.wikimedia.org/wiki/Special:FilePath/${q(p.file)}?width=960`;
  const page = p.page || (p.file ? `https://commons.wikimedia.org/wiki/File:${q(p.file)}` : src);
  const lm = p.role === "landmark";
  return `<figure><a href="${esc(page)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="${esc(p.caption)}"></a>
    <span class="role ${lm ? "" : "hl"}">${lm ? "📍 看到這個就到了" : "⭐ 值得看"}</span>
    <figcaption>${rich(p.caption)}<small>照片：${esc(p.credit || "")}</small></figcaption></figure>`;
}

// ---------- header ----------
document.title = TRIP.title;
$("h-title").textContent = TRIP.title;
$("h-tag").textContent = TRIP.tagline || "";
$("h-chips").innerHTML = (TRIP.chips || []).map(c => `<span class="chip">${esc(c)}</span>`).join("");
const noticeHtml = TRIP.notices && TRIP.notices.length ? `<div class="notice"><strong>⚠️ 出發前確認</strong><ul>${list(TRIP.notices)}</ul></div>` : "";

// ---------- 1. flow ----------
{
  let rows = "";
  TRIP.stops.forEach((s, i) => {
    const isEnd = s.kind === "start" || s.kind === "end";
    const time = s.kind === "start" ? `${s.depart} 出發` : s.kind === "end" ? `${s.arrive} 抵達` : `${s.arrive} – ${s.depart}`;
    const stay = isEnd ? "" : `<span class="stay">${{ meal: "用餐", picnic: "野餐", takeout: "取餐" }[s.kind] || "停留"} ${dur(s.arrive, s.depart)} 分</span>`;
    const anchor = s.kind === "spot" ? "#spot-" + s.id : s.kind === "meal" || s.kind === "takeout" ? "#meals" : s.kind === "picnic" ? "#picnic" : "#driver";
    rows += `<tr><td><span class="t">${time}</span></td><td class="place"><a href="${anchor}">${esc(s.emoji || "")} ${esc(s.name)}</a></td><td>${stay}</td><td>${rich(s.summary || "")}</td></tr>`;
    if (TRIP.errand && TRIP.errand.insert_after === s.id) {
      const E = TRIP.errand;
      rows += `<tr class="move"><td colspan="4">🚐 ${E.stops[0].depart}–${E.stops[E.stops.length - 1].arrive}｜${esc(E.flow_note || E.title)}（乘客照常步行遊覽）</td></tr>`;
    }
    const l = TRIP.legs[i];
    if (l) rows += `<tr class="move"><td colspan="4">${l.mode === "walk" ? "🚶 步行" : "🚐 車程"}約 ${l.minutes} 分${l.km ? `（約 ${l.km} 公里）` : ""}${l.brief ? "｜" + esc(l.brief) : ""}</td></tr>`;
  });
  $("flow-body").innerHTML = noticeHtml + `<div class="tw"><table><thead><tr><th>時間</th><th>地點</th><th>停留</th><th>一句話重點</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---------- 2. spots ----------
$("spots-body").innerHTML = `<p class="desc">每一站先看「📍 看到這個就到了」的照片確認沒走錯，再看「⭐ 值得看」的照片知道要找什麼。點照片可看原圖與出處。</p>` +
  TRIP.stops.filter(s => s.kind === "spot").map((s, n) => `
  <article class="spot" id="spot-${esc(s.id)}">
    <div class="spot-head"><h3>${esc(s.emoji || "")} ${n + 1}. ${esc(s.name)}</h3>
      <span class="meta">${s.arrive} – ${s.depart}（${dur(s.arrive, s.depart)} 分）</span></div>
    <p class="meta">${[s.hours && "🕒 " + s.hours, s.fee && "🎫 " + s.fee, s.address && "📍 " + s.address].filter(Boolean).map(esc).join("　")}
      　<a href="${mapUrl(s)}" target="_blank" rel="noopener">開啟地圖</a></p>
    <p class="tagline">${rich(s.summary || "")}</p>
    <div class="photos">${(s.photos || []).map(photoHtml).join("")}</div>
    <div class="boxes">
      <div class="box"><h4>👀 到了值得關注什麼</h4><ul>${list(s.focus)}</ul></div>
      <div class="box story"><h4>📖 這裡發生過什麼故事</h4><ul>${list(s.story)}</ul></div>
      <div class="box act"><h4>🎯 在這裡可以做什麼</h4><ul>${list(s.activities)}</ul></div>
    </div>
    ${s.tip ? `<div class="tip">💡 ${rich(s.tip)}</div>` : ""}
  </article>`).join("");

// ---------- 3. meals ----------
function optHtml(o, id, on, label) {
  return `<div class="opt ${on ? "on" : ""}" id="${id}">
      ${label ? `<div class="opt-label">${esc(label)}</div>` : ""}
      <div class="banner"><h3>${esc(o.name)}</h3>
        <p>📍 ${esc(o.address || "")}　<a href="${mapUrl(o)}" target="_blank" rel="noopener">地圖／店家照片</a></p>
        <p>${[o.hours && "🕒 " + o.hours, o.phone && "☎ " + o.phone, o.diet && "🥬 " + o.diet].filter(Boolean).map(esc).join("　")}</p>
        ${o.note ? `<p>${rich(o.note)}</p>` : ""}</div>
      ${(o.photos || []).length ? `<div class="photos">${o.photos.map(photoHtml).join("")}</div>` : ""}
      <div class="menu">${(o.menu || []).map(c => `<div class="cat"><h4>${esc(c.category)}</h4>${c.items.map(d => `
        <div class="dish"><div>${esc(d.name)}${d.tag ? `<span class="hot">${esc(d.tag)}</span>` : ""}${d.desc ? `<small>${esc(d.desc)}</small>` : ""}</div>
        <div class="price">${d.price != null && d.price !== "" ? (typeof d.price === "number" ? "$" + d.price : esc(d.price)) : "現場價"}</div></div>`).join("")}</div>`).join("")}</div>
      ${o.suggest ? `<div class="tip">💡 ${rich(o.suggest)}</div>` : ""}
      <p class="src">菜單來源：${o.source_url ? `<a href="${esc(o.source_url)}" target="_blank" rel="noopener">${esc(o.source || o.source_url)}</a>` : esc(o.source || "")}${o.source_note ? "｜" + esc(o.source_note) : ""}</p>
    </div>`;
}
$("meals-body").innerHTML = TRIP.stops.filter(s => s.kind === "meal" || s.kind === "picnic" || s.kind === "takeout").map((s, mi) => {
  if (s.kind === "picnic") {
    return `<div id="picnic"><p class="desc"><strong>${esc(s.emoji || "")} ${esc(s.name)}</strong>　${s.arrive} – ${s.depart}（${dur(s.arrive, s.depart)} 分）。${rich(s.summary || "")}</p>
      <div class="notice"><strong>怎麼進行</strong><ul>${list(s.how)}</ul></div>
      <p class="meta">📍 ${esc(s.address || "")}　<a href="${mapUrl(s)}" target="_blank" rel="noopener">開啟地圖</a></p>
      <div class="photos">${(s.photos || []).map(photoHtml).join("")}</div>
      ${(s.shops || []).map((o, i) => optHtml(o, `picnic-${i}`, true, `外帶店 ${i + 1}／${s.shops.length}`)).join("")}
      ${s.tip ? `<div class="tip">💡 ${rich(s.tip)}</div>` : ""}</div>`;
  }
  const opts = s.options || [];
  const tabs = opts.length > 1 ? `<div class="tabs">${opts.map((o, i) => `<button class="${i ? "" : "on"}" data-meal="${mi}" data-opt="${i}">${esc(o.label || o.name)}</button>`).join("")}</div>` : "";
  return `<p class="desc"><strong>${esc(s.name)}</strong>　${s.arrive} – ${s.depart}（${dur(s.arrive, s.depart)} 分）。${rich(s.summary || "")}</p>${tabs}` +
    opts.map((o, i) => optHtml(o, `meal-${mi}-${i}`, !i, opts.length > 1 ? `${o.label || o.name}（${i + 1}／${opts.length}）` : "")).join("");
}).join("<hr style='border:none;border-top:1px solid var(--line);margin:1.4rem 0'>") || `<p class="desc">本行程未安排用餐點。</p>`;
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  const m = b.dataset.meal;
  document.querySelectorAll(`.tabs button[data-meal="${m}"]`).forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(`[id^="meal-${m}-"]`).forEach(x => x.classList.toggle("on", x.id === `meal-${m}-${b.dataset.opt}`));
});

// ---------- 4. driver ----------
// Optional side trip: the driver alone goes to buy take-away food while passengers keep walking.
function errandHtml() {
  const E = TRIP.errand;
  if (!E) return "";
  const P = E.stops, pts = P.map(p => p.map || p.name);
  const loop = `https://www.google.com/maps/dir/?api=1&origin=${q(pts[0])}&destination=${q(pts[pts.length - 1])}` +
    (pts.length > 2 ? `&waypoints=${pts.slice(1, -1).map(q).join("%7C")}` : "") + "&travelmode=driving";
  const rows = P.map((p, i) => `<tr><td>${i + 1}</td><td><strong>${esc(p.name)}</strong><br><small style="color:var(--muted)">${esc(p.address || "")}</small></td>
    <td>${p.arrive ? `<span class="t">${p.arrive}</span>` : "—"}</td><td>${p.depart ? `<span class="t">${p.depart}</span>` : "—"}</td><td>${rich(p.note || "")}</td></tr>`).join("");
  const legs = E.legs.map((l, i) => `<div class="leg"><div class="leg-head"><b>採買路段 ${i + 1}：${esc(P[i].name)} ➔ ${esc(P[i + 1].name)}</b>
      <span class="leg-time">${P[i].depart} 開車 → ${P[i + 1].arrive} 到達｜約 ${l.minutes} 分${l.km ? "・約 " + l.km + " 公里" : ""}</span></div>
      <ol>${list(l.route)}</ol>
      ${l.caution ? `<div class="tip">⚠️ ${rich(l.caution)}</div>` : ""}
      ${l.parking ? `<div class="park"><strong>🅿️ 停車／購買：</strong>${rich(l.parking)}</div>` : ""}
      <a class="btn" target="_blank" rel="noopener" href="${navUrl(pts[i], pts[i + 1])}">🧭 開啟此路段導航</a></div>`).join("");
  return `<h3 class="sub">🧺 ${esc(E.title)}</h3>${E.intro ? `<p class="desc">${rich(E.intro)}</p>` : ""}
    <div class="tw"><table><thead><tr><th>#</th><th>地點</th><th>到達</th><th>離開</th><th>備註</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p style="margin-top:.6rem"><a class="btn" target="_blank" rel="noopener" href="${loop}">🗺️ 採買全程路線（一次載入）</a></p>${legs}`;
}
{
  const S = TRIP.stops, first = S[0], last = S[S.length - 1];
  const drive = TRIP.legs.filter(l => l.mode !== "walk");
  const totalMin = drive.reduce((a, l) => a + l.minutes, 0), totalKm = drive.reduce((a, l) => a + (l.km || 0), 0);
  // whole-day link: every driving destination in order
  const pts = [legNav(drive[0]).o, ...drive.map(l => legNav(l).d)];
  const allUrl = `https://www.google.com/maps/dir/?api=1&origin=${q(pts[0])}&destination=${q(pts[pts.length - 1])}` +
    (pts.length > 2 ? `&waypoints=${pts.slice(1, -1).map(q).join("%7C")}` : "") + "&travelmode=driving";

  const rows = S.map((s, i) => {
    const prev = TRIP.legs[i - 1];
    const how = i === 0 ? "—" : prev.mode === "walk" ? "🚶 乘客步行（車不動）" : "🚐 開車";
    return `<tr><td>${i + 1}</td><td><strong>${esc(s.name)}</strong><br><small style="color:var(--muted)">${esc(s.address || "")}</small></td>
      <td>${s.arrive ? `<span class="t">${s.arrive}</span>` : "—"}</td><td>${s.depart ? `<span class="t">${s.depart}</span>` : "—"}</td>
      <td>${s.arrive && s.depart ? dur(s.arrive, s.depart) + " 分" : "—"}</td><td>${how}</td><td>${rich(s.driver || "")}</td></tr>`;
  }).join("");

  let legs = "", n = 0;
  TRIP.legs.forEach(l => {
    const a = byId[l.from], b = byId[l.to];
    if (l.mode === "walk") { legs += `<div class="walk">🚶 ${esc(a.name)} → ${esc(b.name)}：乘客步行約 ${l.minutes} 分，<strong>車輛不需移動</strong>${l.brief ? "（" + esc(l.brief) + "）" : ""}</div>`; return; }
    n++; const nv = legNav(l);
    legs += `<div class="leg"><div class="leg-head"><b>路段 ${n}：${esc(a.name)} ➔ ${esc(b.name)}</b>
      <span class="leg-time">${l.depart} 開車 → ${l.arrive} 到達｜約 ${l.minutes} 分${l.km ? "・" + l.km + " 公里" : ""}</span></div>
      ${l.before ? `<p style="font-size:.9rem;margin-bottom:.4rem">⏳ ${rich(l.before)}</p>` : ""}
      <ol>${list(l.route)}</ol>
      ${l.caution ? `<div class="tip">⚠️ ${rich(l.caution)}</div>` : ""}
      ${l.parking ? `<div class="park"><strong>🅿️ 下客／停車：</strong>${rich(l.parking)}</div>` : ""}
      <a class="btn" target="_blank" rel="noopener" href="${navUrl(nv.o, nv.d)}">🧭 開啟此路段導航</a>
      <a class="btn alt" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q(nv.d)}">📍 只看目的地</a></div>`;
  });

  $("driver-body").innerHTML = `
    <p class="desc">司機只需要看這一區。時間為預估，實際路線請以當下導航與路況為準。</p>
    <div class="stats">
      <div class="stat"><span>🚩 出發點</span><b>${esc(first.name)}</b><small>${esc(first.address || "")}｜${first.depart} 發車</small></div>
      <div class="stat"><span>🏁 結束點</span><b>${esc(last.name)}</b><small>${esc(last.address || "")}｜約 ${last.arrive} 抵達</small></div>
      <div class="stat"><span>🛣️ 全日開車</span><b>${drive.length} 段・約 ${totalMin} 分</b><small>${totalKm ? "約 " + Math.round(totalKm) + " 公里｜" : ""}中途停靠 ${S.length - 2} 點</small></div>
    </div>
    <a class="btn" target="_blank" rel="noopener" href="${allUrl}">🗺️ 全日路線（Google 地圖一次載入所有停靠點）</a>
    <button class="btn alt" id="print-driver">🖨️ 列印司機頁</button>
    ${TRIP.driver_notes && TRIP.driver_notes.length ? `<div class="notice" style="margin-top:1rem"><strong>📌 司機注意</strong><ul>${list(TRIP.driver_notes)}</ul></div>` : ""}
    <h3 class="sub">各點到達／離開時刻表</h3>
    <div class="tw"><table><thead><tr><th>#</th><th>地點</th><th>到達</th><th>離開</th><th>停留</th><th>怎麼到</th><th>下客／停車</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h3 class="sub">點到點路線</h3>${legs}${errandHtml()}`;
  $("print-driver").onclick = () => { document.body.classList.add("print-driver"); window.print(); };
  window.onafterprint = () => document.body.classList.remove("print-driver");
}
$("foot").textContent = `${TRIP.title}｜資料整理日 ${TRIP.updated || ""}｜營業時間、菜單價格與路況可能變動，出發前請再確認。`;
</script>
</body>
</html>
